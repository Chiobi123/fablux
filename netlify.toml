[build]
  command = "node build.js"
  publish = "dist"

# Send unknown paths to the custom 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers are declared in `_headers` (copied into dist/).
# If you prefer them here, uncomment and keep in sync with `_headers`.
# [[headers]]
#   for = "/*"
#   [headers.values]
#     X-Frame-Options = "DENY"
