</head><body><main><section class="featured"><div class="container"><div class="pro-auth" id="paymentStatus"><div class="section-title"><span>PAYMENT</span><h2>Checking your payment…</h2><p>Please wait while we verify the transaction.</p></div></div></div></section></main><script src="js/store.js?v=20261028k"></script><script src="js/api-client.js?v=20261028k"></script><script src="js/pro.js?v=20261028k"></script><script src="js/backend-bridge.js?v=20261028k"></script><script>
(async()=>{
const box=document.getElementById('paymentStatus');
const q=new URLSearchParams(location.search);
const ref=q.get('reference')||q.get('ref');
if(!ref){box.innerHTML='<div class="section-title"><h2>No payment reference</h2><p>We could not find a transaction to check.</p><a class="btn" href="orders.html">View My Orders</a></div>';return;}
try{
  const d=await window.FabluXAPI.verifyPaystack(ref);
  if(d&&d.paid){
    box.innerHTML='<div class="section-title"><span>PAYMENT CONFIRMED</span><h2>Thank you for your order.</h2><p>This payment was verified with the payment gateway.</p><a class="btn" href="orders.html">View My Orders</a></div>';
  }else{
    box.innerHTML='<div class="section-title"><span>PAYMENT NOT COMPLETED</span><h2>Your order was not paid.</h2><p>No successful charge was found for this reference.</p><a class="btn" href="checkout.html">Return to Checkout</a></div>';
  }
}catch(e){
  box.innerHTML='<div class="section-title"><span>PAYMENT CHECK</span><h2>We could not verify this payment yet.</h2><p>'+String(e&&e.message||'Please try again in a moment.')+'</p><p>Card checkout is only available once payment-gateway credentials are configured for this store. Until then please use Pay on Delivery or Bank Transfer at checkout.</p><a class="btn" href="orders.html">View My Orders</a></div>';
}
})();
</script><!-- a11y/consent/logging -->
