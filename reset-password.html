<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FabluX.U.Design | Reset Password</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pro.css"></head><body><main><section class="featured"><div class="container"><div class="pro-auth"><div class="section-title"><span>ACCOUNT RECOVERY</span><h2>Set New Password</h2><p>Create a new password for your FabluX account.</p></div><form id="resetForm" class="pro-form"><label>New Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm Password<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn" type="submit">Reset Password</button></form></div></div></section></main><script src="js/store.js"></script><script src="js/api-client.js"></script><script src="js/pro.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('resetForm'); const token=new URLSearchParams(location.search).get('token')||''; f.addEventListener('submit',async e=>{e.preventDefault(); if(f.password.value!==f.confirm.value){window.FabluXStore?.toast('Passwords do not match');return} try{await window.FabluXAPI.resetPassword(token,f.password.value);window.FabluXStore?.toast('Password reset successfully');setTimeout(()=>location.href='login.html',700)}catch(err){window.FabluXStore?.toast(err.message)}});});</script></body></html>
