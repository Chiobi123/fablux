<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FabluX.U.Design | Payment</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pro.css"></head><body><main><section class="featured"><div class="container"><div class="pro-auth" id="paymentStatus"><div class="section-title"><span>PAYMENT</span><h2>Confirming your payment…</h2><p>Please wait while we securely verify the transaction.</p></div></div></div></section></main><script src="js/store.js"></script><script src="js/api-client.js"></script><script>
(async()=>{const box=document.getElementById('paymentStatus');const ref=new URLSearchParams(location.search).get('reference');if(!ref){box.innerHTML='<div class="section-title"><h2>Payment reference missing</h2><p>We could not verify this payment.</p><a class="btn" href="shop.html">Return to Shop</a></div>';return;}try{const d=await window.FabluXAPI.verifyPaystack(ref);if(d.paid){localStorage.setItem('fablux_cart_v1','[]');box.innerHTML='<div class="section-title"><span>PAYMENT SUCCESSFUL</span><h2>Thank you for your order.</h2><p>Your payment has been verified securely.</p><a class="btn" href="order-success.html?id='+encodeURIComponent(d.orderId)+'">View Order</a></div>';}else{box.innerHTML='<div class="section-title"><span>PAYMENT NOT COMPLETED</span><h2>Your order was not paid.</h2><p>No charge was confirmed for this order.</p><a class="btn" href="checkout.html">Return to Checkout</a></div>';}}catch(e){box.innerHTML='<div class="section-title"><span>PAYMENT CHECK</span><h2>We could not verify the payment yet.</h2><p>'+String(e.message||'Please try again later.')+'</p><a class="btn" href="orders.html">View My Orders</a></div>';}})();
</script></body></html>
